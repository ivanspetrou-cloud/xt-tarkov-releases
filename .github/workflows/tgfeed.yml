name: tg-feed
# Раз в 30 минут обновляет feed/feed.json и feed/feed_en.json — зеркала постов каналов для оверлея XT (у кого Telegram заблокирован).
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: tg-feed
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node feed/tgfeed.mjs
      - run: |
          git config user.name "xt-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/feed.json feed/feed_en.json
          git diff --cached --quiet || (git commit -m "feed: обновление" && git push)
